name: Gource visualization

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: gource-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gource:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gource Action
        uses: nbprojekt/gource-action@57256d303c5a9a5e72ed92ba13e3e83c5ec8b257 # v1.3.0
        with:
          gource_title: "RainbowMiner-HiveOs development timeline"
          gource_resolution: 1920x1080
          gource_fps: 60
          gource_filename_time: 3
          gource_hide_items: "mouse,date,filenames"
          gource_max_files: 2500
          gource_highlight_users: true
          gource_output_framerate: 30
          gource_stop_at_end: true
          gource_auto_skip_seconds: 0.5
          gource_multi_sampling: true
          gource_seconds_per_day: 0.3

      - name: Commit gource video
        run: |
          git config user.name "Corneel (Hermes agent)"
          git config user.email "corneel@freedom.nl"
          git add gource-1080p.mp4 || true
          git diff --staged --quiet || git commit -m "ci: update gource visualization (automated)"
          git push
